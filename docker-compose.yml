services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pickmyelective-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pickmyelective}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pickmyelective}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pickmyelective-network
    restart: unless-stopped

  # RAG Service (Python/FastAPI)
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: pickmyelective-rag
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CHROMA_PATH=/app/data/chroma
      - COLLECTION_NAME=${COLLECTION_NAME:-courses_1264}
    volumes:
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pickmyelective-network
    restart: unless-stopped

  # Backend (Spring Boot)
  backend:
    build:
      context: ./backend/demo
      dockerfile: Dockerfile
    container_name: pickmyelective-backend
    environment:
      - SUPABASE_DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pickmyelective}
      - SUPABASE_DB_USERNAME=${POSTGRES_USER:-postgres}
      - SUPABASE_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RAG_SERVICE_URL=http://rag:8000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:80}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pickmyelective-network
    restart: unless-stopped

  # Frontend (React/Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    container_name: pickmyelective-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - pickmyelective-network
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:

networks:
  pickmyelective-network:
    driver: bridge
