# Production Profile Configuration
# Activate with: --spring.profiles.active=prod

# Override JPA settings for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging - reduce verbosity for production
logging.level.root=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Actuator - restrict exposed endpoints in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# CORS Configuration - Override with production domain(s)
# Set via environment variable: CORS_ALLOWED_ORIGINS=https://yourdomain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://pickmyelective.com}
